{% extends 'core/base.html' %}

{% block page_title %}Kitchen Display (KDS){% endblock %}

{% block content %}
<div x-data="kdsSystem()" x-init="init()" class="space-y-6">
    <!-- Notification Sound -->
    <audio id="newOrderSound" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>

    <!-- KDS Header -->
    <div class="flex flex-wrap items-center justify-between gap-4 p-4 app-card">
        <div class="flex items-center gap-4">
            <div class="flex items-center gap-2">
                <div :class="connectionStatus === 'online' ? 'bg-green-500' : 'bg-red-500'" class="w-2 h-2 rounded-full"></div>
                <span class="text-xs font-bold uppercase tracking-wider text-gray-500" x-text="connectionStatus"></span>
            </div>
            <div class="px-3 py-1 bg-gray-900 text-white text-[10px] font-bold uppercase rounded">
                Tickets: <span x-text="orders.length"></span>
            </div>
        </div>
        <div class="flex items-center gap-4">
            <p class="text-[10px] font-bold text-gray-400 uppercase tracking-widest">
                Sync <span class="text-gray-600 ml-1" x-text="lastSyncTime"></span>
            </p>
            <button @click="fetchOrders()" class="text-gray-400 hover:text-blue-600">
                <span class="material-icons text-sm">refresh</span>
            </button>
        </div>
    </div>

    <!-- Ticket Grid -->
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4" id="kitchen-container">
        <template x-for="order in orders" :key="order.id">
            <div class="app-card flex flex-col border-t-4" :style="'border-top-color: ' + getPriorityColor(order.created_at)">
                
                <!-- Ticket Header -->
                <div class="p-4 border-b border-gray-100 bg-gray-50/50">
                    <div class="flex justify-between items-start mb-2">
                        <div class="flex items-center gap-3">
                            <div class="w-8 h-8 bg-gray-900 text-white rounded flex items-center justify-center text-xs font-bold">
                                T<span x-text="order.table_number"></span>
                            </div>
                            <div>
                                <h3 class="text-xs font-bold text-gray-900" x-text="'#' + order.id"></h3>
                                <p class="text-[9px] font-medium text-gray-400 uppercase" x-text="order.staff"></p>
                            </div>
                        </div>
                        <span class="text-[10px] font-bold text-gray-900" x-text="formatTime(order.created_at)"></span>
                    </div>
                </div>

                <!-- Order Items -->
                <div class="flex-1 p-2 space-y-1">
                    <template x-for="item in order.items" :key="item.id">
                        <div class="flex items-center justify-between p-2 rounded hover:bg-gray-50 border border-transparent hover:border-gray-100 transition-colors">
                            <div class="flex items-center gap-3 min-w-0">
                                <span class="text-xs font-bold text-gray-400 w-6" x-text="item.quantity + 'x'"></span>
                                <p class="text-xs font-medium text-gray-700 truncate" :class="item.status === 'ready' ? 'line-through text-gray-300' : ''" x-text="item.name"></p>
                            </div>
                            
                            <div class="flex items-center gap-1">
                                <template x-if="item.status === 'pending'">
                                    <button @click="updateItemStatus(item.id, 'preparing')" class="text-gray-400 hover:text-blue-600">
                                        <span class="material-icons text-lg">play_circle</span>
                                    </button>
                                </template>
                                <template x-if="item.status === 'preparing'">
                                    <button @click="updateItemStatus(item.id, 'ready')" class="text-gray-400 hover:text-green-600">
                                        <span class="material-icons text-lg">check_circle</span>
                                    </button>
                                </template>
                                <template x-if="item.status === 'ready'">
                                    <span class="material-icons text-green-500 text-lg">task_alt</span>
                                </template>
                            </div>
                        </div>
                    </template>
                </div>

                <!-- Ticket Footer -->
                <div class="px-4 py-2 border-t border-gray-100 bg-gray-50/30">
                    <span class="text-[9px] font-bold text-gray-400 uppercase" x-text="getElapsedTime(order.created_at)"></span>
                </div>
            </div>
        </template>
    </div>
    
    <div x-show="orders.length === 0" class="py-20 text-center app-card">
        <p class="text-xs font-bold text-gray-400 uppercase tracking-widest">No active orders</p>
    </div>
</div>

<script>
function kdsSystem() {
    return {
        orders: [],
        connectionStatus: 'online',
        lastSyncTime: '-',
        knownOrderIds: new Set(),

        init() {
            this.fetchOrders();
            setInterval(() => this.fetchOrders(), 5000);
        },

        fetchOrders() {
            fetch('/ajax/get-active-orders/')
                .then(res => res.json())
                .then(data => {
                    if (data.status === 'success') {
                        this.connectionStatus = 'online';
                        this.lastSyncTime = new Date().toLocaleTimeString();
                        this.orders = data.orders;
                    }
                })
                .catch(() => this.connectionStatus = 'offline');
        },

        updateItemStatus(itemId, status) {
            const formData = new FormData();
            formData.append('item_id', itemId);
            formData.append('status', status);
            fetch('/ajax/update-item-status/', {
                method: 'POST',
                headers: { 'X-CSRFToken': '{{ csrf_token }}' },
                body: formData
            }).then(() => this.fetchOrders());
        },

        formatTime(timestamp) {
            return new Date(timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        },

        getElapsedTime(timestamp) {
            const diff = Math.floor((new Date() - new Date(timestamp)) / 60000);
            return diff + 'm on desk';
        },

        getPriorityColor(timestamp) {
            const diff = Math.floor((new Date() - new Date(timestamp)) / 60000);
            if (diff > 15) return '#ef4444';
            if (diff > 8) return '#f59e0b';
            return '#2563eb';
        }
    }
}
</script>
{% endblock %}
