{% extends 'core/base.html' %}

{% block page_title %}Kitchen Display (KDS){% endblock %}

{% block content %}
<div x-data="kdsSystem()" x-init="init()" class="kds-wrapper space-y-6">
    <!-- Notification Sound -->
    <audio id="newOrderSound" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>

    <!-- KDS System Bar -->
    <div class="flex flex-wrap items-center justify-between gap-4 sticky top-16 z-20 bg-slate-50/80 backdrop-blur-md py-4 border-b border-slate-100 -mx-4 px-4 lg:-mx-8 lg:px-8">
        <div class="flex items-center gap-3">
            <div class="px-4 py-1.5 bg-white rounded-xl shadow-sm border border-slate-100 flex items-center gap-3 transition-all group">
                <div :class="connectionStatus === 'online' ? 'bg-emerald-500' : 'bg-rose-500'" class="w-2 h-2 rounded-full animate-pulse shadow-lg shadow-emerald-200"></div>
                <span class="text-[10px] font-black uppercase tracking-widest text-slate-500" x-text="'System ' + connectionStatus"></span>
            </div>
            <div class="px-4 py-1.5 bg-slate-900 rounded-xl shadow-xl flex items-center gap-2">
                <span class="text-[10px] font-black uppercase tracking-widest text-slate-400">Tickets: <span class="text-white" x-text="orders.length"></span></span>
            </div>
        </div>
        <div class="flex items-center gap-4">
            <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">
                Last Sync <span class="text-slate-600 ml-1" x-text="lastSyncTime"></span>
            </p>
            <button @click="fetchOrders()" class="w-8 h-8 flex items-center justify-center bg-white rounded-lg border border-slate-100 hover:text-teal-600 transition-all active:rotate-180 duration-500">
                <span class="material-symbols-rounded text-sm">refresh</span>
            </button>
        </div>
    </div>

    <!-- Ticket Grid -->
    <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 2xl:grid-cols-4 gap-6" id="kitchen-container">
        <template x-for="order in orders" :key="order.id">
            <div class="col animate-fade-in group">
                <div class="app-card h-full flex flex-col overflow-hidden transition-all duration-300 group-hover:shadow-2xl border-t-4" 
                     :style="'border-top-color: ' + getPriorityColor(order.created_at)">
                    
                    <!-- Ticket Header -->
                    <div class="p-5 border-b border-slate-50 bg-white group-hover:bg-slate-50/50 transition-colors">
                        <div class="flex justify-between items-start mb-4">
                            <div class="flex items-center gap-3">
                                <div class="w-12 h-12 bg-slate-900 text-white rounded-2xl flex flex-col items-center justify-center shadow-lg">
                                    <span class="text-[9px] font-black leading-none opacity-60">TBL</span>
                                    <span class="text-lg font-black leading-none" x-text="order.table_number"></span>
                                </div>
                                <div>
                                    <h3 class="text-xs font-black text-slate-900 leading-tight uppercase tracking-wider" x-text="' Ticket #' + order.id"></h3>
                                    <p class="text-[10px] font-bold text-slate-400" x-text="'Server: ' + order.staff"></p>
                                </div>
                            </div>
                            <div class="text-right">
                                <p class="text-xs font-black text-slate-900 tracking-tighter" x-text="formatTime(order.created_at)"></p>
                                <div class="flex items-center gap-1.5 justify-end mt-1">
                                    <span class="w-1.5 h-1.5 rounded-full" :style="'background-color: ' + getPriorityColor(order.created_at)"></span>
                                    <span class="text-[9px] font-black uppercase tracking-tighter" :style="'color: ' + getPriorityColor(order.created_at)" x-text="getPriorityLabel(order.created_at)"></span>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Order Items -->
                    <div class="p-5 flex-1 bg-white space-y-3">
                        <template x-for="item in order.items" :key="item.id">
                            <div class="flex items-center justify-between p-3 rounded-2xl border transition-all"
                                 :class="item.status === 'ready' || item.status === 'served' ? 'border-slate-50 bg-slate-50/30 opacity-60' : 'border-slate-100 hover:border-teal-200'">
                                <div class="flex items-center gap-4 min-w-0">
                                    <div class="w-8 h-8 rounded-xl flex items-center justify-center font-black text-xs shrink-0 transition-colors"
                                         :class="item.status === 'preparing' ? 'bg-orange-100 text-orange-600 animate-pulse' : 'bg-slate-100 text-slate-500'" 
                                         x-text="item.quantity + 'x'"></div>
                                    <p class="text-xs font-bold text-slate-800 truncate" :class="item.status === 'ready' ? 'line-through text-slate-400' : ''" x-text="item.name"></p>
                                </div>
                                
                                <div class="flex items-center gap-2">
                                    <template x-if="item.status === 'pending'">
                                        <button @click="updateItemStatus(item.id, 'preparing')" class="w-8 h-8 flex items-center justify-center bg-slate-900 text-white rounded-xl shadow-lg hover:scale-110 active:scale-90 transition-all">
                                            <span class="material-symbols-rounded text-sm">play_arrow</span>
                                        </button>
                                    </template>
                                    <template x-if="item.status === 'preparing'">
                                        <button @click="updateItemStatus(item.id, 'ready')" class="w-8 h-8 flex items-center justify-center bg-emerald-600 text-white rounded-xl shadow-lg hover:scale-110 active:scale-90 transition-all">
                                            <span class="material-symbols-rounded text-sm">check</span>
                                        </button>
                                    </template>
                                    <template x-if="item.status === 'ready'">
                                        <div class="w-8 h-8 flex items-center justify-center text-emerald-600">
                                            <span class="material-symbols-rounded">check_circle</span>
                                        </div>
                                    </template>
                                </div>
                            </div>
                        </template>
                    </div>

                    <!-- Footer: Meta Information -->
                    <div class="px-5 py-4 border-t border-slate-50 bg-slate-50/50 flex justify-between items-center">
                        <div class="flex items-center gap-2">
                            <span class="material-symbols-rounded text-slate-400 text-sm">history</span>
                            <span class="text-[10px] font-black text-slate-500 uppercase tracking-widest" x-text="getElapsedTime(order.created_at)"></span>
                        </div>
                        <span class="text-[9px] font-black px-2 py-0.5 rounded-lg bg-white border border-slate-100 text-slate-400 uppercase shadow-sm" x-text="order.status"></span>
                    </div>
                </div>
            </div>
        </template>
        
        <!-- Empty State: Premium Visual -->
        <div x-show="orders.length === 0" class="col-span-full py-24 text-center">
            <div class="w-24 h-24 bg-white rounded-3xl shadow-xl shadow-slate-200 flex items-center justify-center mx-auto mb-6 group hover:rotate-12 transition-transform duration-500">
                <span class="material-symbols-rounded text-slate-200 text-5xl">skillet</span>
            </div>
            <h4 class="text-xl font-black text-slate-900">Quiet in the Kitchen</h4>
            <p class="text-sm text-slate-400 uppercase tracking-widest font-bold mt-2">No active tickets at this time</p>
        </div>
    </div>
</div>

<style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .animate-fade-in { animation: fadeIn 0.4s ease-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
</style>

<script>
function kdsSystem() {
    return {
        orders: [],
        connectionStatus: 'online',
        lastSyncTime: '-',
        pollingInterval: null,
        knownOrderIds: new Set(),

        init() {
            this.fetchOrders();
            this.pollingInterval = setInterval(() => this.fetchOrders(), 5000);
        },

        fetchOrders() {
            fetch('/ajax/get-active-orders/')
                .then(res => res.json())
                .then(data => {
                    if (data.status === 'success') {
                        this.connectionStatus = 'online';
                        this.lastSyncTime = new Date().toLocaleTimeString();
                        
                        data.orders.forEach(order => {
                            if (!this.knownOrderIds.has(order.id)) {
                                if (this.knownOrderIds.size > 0) this.playNotification();
                                this.knownOrderIds.add(order.id);
                            }
                        });

                        const currentIds = new Set(data.orders.map(o => o.id));
                        this.knownOrderIds.forEach(id => {
                            if (!currentIds.has(id)) this.knownOrderIds.delete(id);
                        });

                        this.orders = data.orders;
                    }
                })
                .catch(err => {
                    this.connectionStatus = 'offline';
                });
        },

        updateItemStatus(itemId, status) {
            const formData = new FormData();
            formData.append('item_id', itemId);
            formData.append('status', status);

            fetch('/ajax/update-item-status/', {
                method: 'POST',
                headers: { 'X-CSRFToken': '{{ csrf_token }}' },
                body: formData
            })
            .then(res => res.json())
            .then(data => {
                if (data.status === 'success') this.fetchOrders();
            });
        },

        playNotification() {
            const audio = document.getElementById('newOrderSound');
            if (audio) {
                audio.currentTime = 0;
                audio.play().catch(e => console.log('Sound blocked'));
            }
        },

        formatTime(timestamp) {
            return new Date(timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        },

        getElapsedTime(timestamp) {
            const diff = Math.floor((new Date() - new Date(timestamp)) / 60000);
            return diff + ' min in service';
        },

        getPriorityColor(timestamp) {
            const diff = Math.floor((new Date() - new Date(timestamp)) / 60000);
            if (diff > 15) return '#ef4444'; // Critical Red
            if (diff > 8) return '#f97316';  // Aging Orange
            return '#0f766e';               // Fresh Teal
        },

        getPriorityLabel(timestamp) {
            const diff = Math.floor((new Date() - new Date(timestamp)) / 60000);
            if (diff > 15) return 'CRITICAL';
            if (diff > 8) return 'WAITING';
            return 'FRESH';
        }
    }
}
</script>
{% endblock %}
