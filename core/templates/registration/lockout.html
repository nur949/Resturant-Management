{% extends 'core/base.html' %}

{% block content %}
<div class="flex items-center justify-center min-h-[60vh]">
    <div class="card max-w-md w-full p-8 text-center elevation-4 border-0">
        <div class="w-20 h-20 bg-red-100 text-red-600 rounded-full flex items-center justify-center mx-auto mb-6">
            <span class="material-symbols-outlined text-4xl">lock</span>
        </div>
        <h2 class="text-2xl font-bold text-gray-800 mb-4">Account Locked</h2>
        <p class="text-gray-600 mb-6">
            Too many failed login attempts. For security reasons, your account or IP has been temporarily locked.
        </p>
        <p class="text-sm text-gray-500 mb-8">
            Please try again in 1 hour or contact the system administrator.
        </p>
        <a href="{% url 'login' %}" class="btn btn-primary w-full py-3">
            Back to Login
        </a>
    </div>
</div>
{% endblock %}
