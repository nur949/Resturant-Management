<li class="relative">
    <a href="{{ url }}" class="flex items-center px-4 py-3 rounded-xl transition-all duration-300 group/item {% if active %}bg-primary/10 text-primary shadow-sm{% else %}text-slate-400 hover:bg-white/5 hover:text-white{% endif %}">
        <i class="fas {{ icon }} text-lg w-6 flex justify-center transition-transform duration-300 group-hover/item:scale-110"></i>
        <span x-show="sidebarOpen" x-transition.opacity.duration.400ms class="ml-4 text-xs font-bold tracking-wide transition-all duration-300">{{ label }}</span>
        
        <!-- Active Indicator Glow -->
        {% if active %}
        <div class="absolute inset-y-2 left-0 w-1 bg-primary rounded-r-full shadow-[0_0_15px_rgba(255,107,53,0.5)]"></div>
        {% endif %}
    </a>
</li>
