<li class="relative group">
    <a href="{{ url }}" 
       class="flex items-center px-4 py-3 rounded-xl transition-all duration-300 {% if active_check in request.path or active_check == 'dashboard' and request.path == '/' %}bg-primary text-white shadow-lg shadow-primary/30{% else %}text-slate-400 hover:bg-white/5 hover:text-white{% endif %}">
        <i class="fas {{ icon }} text-lg w-6 flex justify-center transition-transform group-hover:scale-110"></i>
        <span class="ml-4 text-xs font-bold tracking-wide">{{ label }}</span>
        
        {% if active_check in request.path or active_check == 'dashboard' and request.path == '/' %}
        <div class="absolute inset-y-3 right-2 w-1.5 h-1.5 bg-white rounded-full"></div>
        {% endif %}
    </a>
</li>
