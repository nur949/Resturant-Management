<div x-data="{ open: {% if active_check in request.path %}true{% else %}false{% endif %} }" class="space-y-1">
    <button @click="open = !open" 
            class="w-full flex items-center justify-between px-4 py-3 rounded-xl transition-all duration-300 text-slate-400 hover:bg-white/5 hover:text-white group">
        <div class="flex items-center">
            <i class="fas {{ icon }} text-lg w-6 flex justify-center transition-transform group-hover:scale-110"></i>
            <span class="ml-4 text-xs font-bold tracking-wide">{{ label }}</span>
        </div>
        <i class="fas fa-chevron-right text-[10px] transition-transform duration-300" :class="open ? 'rotate-90' : ''"></i>
    </button>
    
    <div x-show="open" x-cloak x-collapse class="pl-10 space-y-1">
        {% for item in items %}
            <a href="{{ item.url }}" 
               class="block px-4 py-2 text-[11px] font-bold rounded-lg transition-all {% if item.url in request.path %}text-primary bg-primary/5{% else %}text-slate-500 hover:text-white hover:bg-white/5{% endif %}">
                {{ item.label }}
            </a>
        {% endfor %}
    </div>
</div>
